name: 'Release HENU PA'

# Trigger on semantic version tag push or manual dispatch
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version (e.g., 1.0.0 or 1.1.0-beta.1)'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - stable
          - beta
          - nightly
        default: stable
      release-notes:
        description: 'Release changelog notes in Markdown'
        required: false
        default: 'Production release of HENU PA Personal Assistant with native desktop voice processing and workflow triggers.'
        type: string

# Least-privilege permissions
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Execute HENU PA Release Pipeline
    uses: henu-os/henu-common-actions/.github/workflows/release-orchestrator.yml@v1
    with:
      product-id: 'henu-pa'
      product-name: 'HENU PA'
      version: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && format('{0}', substr(github.ref, 11)) || '1.0.0') }}
      channel: ${{ inputs.channel || (contains(github.ref, '-beta') && 'beta' || (contains(github.ref, '-nightly') && 'nightly' || 'stable')) }}
      git-tag: ${{ github.ref_name }}
      release-notes: ${{ inputs.release-notes || 'HENU PA Official Release' }}
      min-hub-version: '1.0.0'
      # Platform Targets
      build-windows: true
      windows-format: 'msi'
      windows-arch: 'x86_64'
      windows-build-command: 'npm run build:msi'
      build-macos: true
      macos-format: 'dmg'
      macos-arch: 'universal'
      macos-build-command: 'npm run build:dmg'
      build-linux: true
      linux-format: 'appimage'
      linux-arch: 'x86_64'
      linux-build-command: 'npm run build:appimage'
      platform-api-url: 'https://api.henuos.com/api/v1/webhooks/github'
    secrets:
      platform-webhook-secret: ${{ secrets.HENU_WEBHOOK_SECRET }}
