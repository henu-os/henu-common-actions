name: 'Reusable: Build macOS Package'

on:
  workflow_call:
    inputs:
      product-id:
        description: 'Kebab-case product identifier'
        required: true
        type: string
      version:
        description: 'Release semantic version'
        required: true
        type: string
      package-format:
        description: 'Target package format (dmg, pkg, zip)'
        required: false
        default: 'dmg'
        type: string
      arch:
        description: 'CPU architecture (arm64, x86_64, universal)'
        required: false
        default: 'universal'
        type: string
      build-command:
        description: 'Shell command to execute macOS build'
        required: false
        default: 'npm run build'
        type: string
      output-dir:
        description: 'Directory containing built artifacts'
        required: false
        default: 'dist'
        type: string
    outputs:
      artifact-name:
        description: 'Uploaded artifact name'
        value: macos-${{ inputs.product-id }}-${{ inputs.arch }}-${{ inputs.package-format }}

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS (${{ inputs.arch }} / ${{ inputs.package-format }})
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js Toolchain
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a1 # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute macOS Build
        run: ${{ inputs.build-command }}

      - name: Package Verification
        shell: bash
        run: |
          mkdir -p output
          FOUND_PACKAGE=$(find ${{ inputs.output-dir }} -type f \( -name "*.${{ inputs.package-format }}" -o -name "*.dmg" -o -name "*.pkg" -o -name "*.zip" \) | head -n 1)
          if [ -z "$FOUND_PACKAGE" ]; then
            echo "::error::No package matching format '${{ inputs.package-format }}' found in '${{ inputs.output-dir }}'"
            exit 1
          fi
          TARGET_NAME="${{ inputs.product-id }}-${{ inputs.version }}-macos-${{ inputs.arch }}.${{ inputs.package-format }}"
          cp "$FOUND_PACKAGE" "output/$TARGET_NAME"
          echo "Package prepared: output/$TARGET_NAME ($(stat -f%z output/$TARGET_NAME) bytes)"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: macos-${{ inputs.product-id }}-${{ inputs.arch }}-${{ inputs.package-format }}
          path: output/*
          if-no-files-found: error
          retention-days: 5
