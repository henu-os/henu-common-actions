name: 'Reusable: Generate Checksums'

on:
  workflow_call:
    inputs:
      assets-dir:
        description: 'Directory where built packages are gathered'
        required: false
        default: 'release-assets'
        type: string
    outputs:
      sums-file:
        description: 'Path to generated SHA256SUMS file'
        value: ${{ jobs.checksums.outputs.sums-file }}

permissions:
  contents: read

jobs:
  checksums:
    name: Generate Streaming SHA-256 Checksums
    runs-on: ubuntu-latest
    outputs:
      sums-file: ${{ steps.gen.outputs.sums_path }}
    steps:
      - name: Checkout Common Actions Tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: henu-os/henu-common-actions
          path: .henu-common-actions
          persist-credentials: false

      - name: Download Build Artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: ${{ inputs.assets-dir }}
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a1 # v4.1.0
        with:
          node-version: '20'

      - name: Compute Checksums
        id: gen
        shell: bash
        run: |
          node .henu-common-actions/scripts/generate-checksums.js "${{ inputs.assets-dir }}" "${{ inputs.assets-dir }}/SHA256SUMS"
          echo "sums_path=${{ inputs.assets-dir }}/SHA256SUMS" >> $GITHUB_OUTPUT
          cat "${{ inputs.assets-dir }}/SHA256SUMS"

      - name: Upload Consolidated Package Bundle
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: consolidated-release-assets
          path: ${{ inputs.assets-dir }}/*
          if-no-files-found: error
          retention-days: 5
